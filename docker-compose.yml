services:
  black-hands:
    build:
      context: .
    container_name: black-hands
    restart: unless-stopped
    # required: false -> Deploy bricht nicht ab, falls keine physische .env
    # vorhanden ist (z. B. bei Portainer-Stacks aus Git, wo .env nicht
    # mitkommt). Dort trägst du BOT_TOKEN/BOT_CLIENTID/BOT_GUILDID stattdessen
    # unter "Environment variables" des Stacks ein.
    env_file:
      - path: .env
        required: false
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_CLIENTID: ${BOT_CLIENTID}
      BOT_GUILDID: ${BOT_GUILDID}
    volumes:
      # Laufzeit-Daten (wer hat schon einen Clip-Channel, wer ist freigeschaltet)
      # bleiben über Rebuilds hinweg erhalten. config.json wird bewusst NICHT
      # gemountet (Datei-Bind-Mounts brechen auf manchen Docker-Hosts/Portainer,
      # wenn dort mal ein Verzeichnis statt einer Datei angelegt wurde) -
      # sie kommt stattdessen aus dem Image (Dockerfile COPY). Änderung an
      # config.json -> committen, pushen, Stack neu bauen ("Update the stack").
      - ./src/data:/usr/src/app/data
